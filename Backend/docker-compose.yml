
services:
  frontend:
    build:
      context: ..
      dockerfile: Frontend/Dockerfile
    container_name: signlang_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_BACKEND_URL: http://127.0.0.1:8000
      VITE_AI_API_URL: http://127.0.0.1:8001
    depends_on:
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    container_name: signlang_backend
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
  ai:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    container_name: signlang_ai
    command: uvicorn AIML_CV.main:app --app-dir /app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
