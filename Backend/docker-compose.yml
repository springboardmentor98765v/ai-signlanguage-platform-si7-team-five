
services:
  backend:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    container_name: signlang_backend
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.production
    restart: unless-stopped
  ai:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    container_name: signlang_ai
    command: uvicorn AIML_CV.main:app --app-dir /app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    env_file:
      - .env.production
    restart: unless-stopped
