services:

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: signlang_backend
    ports:
      - "8002:8000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai:
    build:
      context: ./AIML_CV
      dockerfile: Dockerfile
    container_name: signlang_ai
    ports:
      - "8001:8001"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: signlang_frontend
    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped